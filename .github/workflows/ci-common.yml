name: CI tests when code pushed to repository

on:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    name: ESLint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install  # I wish package-lock.json was in git, cos then it would be "npm ci"

      - name: Run ESLint
        run: npm run lint

  test:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          # cache: npm

      - name: Install dependencies
        run: npm install  # I wish package-lock.json was in git, cos then it would be "npm ci"

      - name: Run unit tests
        run: npm test

      - name: Upload diagnostic files
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: diagnostic-files
          path: |
            unit_tests/logs/
            unit_tests/test_output/appSettings.json
            unit_tests/test_output/config/modules/
            unit_tests/test_output/config/nodeConfig.json
            unit_tests/test_output/test_user/
          if-no-files-found: warn
