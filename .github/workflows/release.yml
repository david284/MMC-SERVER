name: Release

on:
  # Real releases are triggered by version tags.
  push:
    tags:
      - 'v*.*.*'

  # Allows the release build to be tested manually from any branch.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci-common.yml
    #
    # TODO: Refactor the platform packaging jobs once Windows and Linux
    # packaging have been proven. Much of the application staging,
    # version validation, MMC-CLIENT installation, and release handling
    # is currently duplicated between platform jobs.
    #
    # Consider extracting common steps into a reusable workflow or
    # composite action, leaving each platform job responsible only for
    # platform-specific runtime packaging and installer/archive creation.

  windows-x64:
    name: Build Windows x64 distribution
    needs: ci
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          architecture: x64
          cache: npm

      - name: Prepare distribution
        uses: ./.github/actions/prepare-distribution

      - name: Copy Node.js runtime
        shell: pwsh
        run: |
          Copy-Item (Get-Command node).Source dist/MMC/runtime/node.exe

      - name: Copy launcher
        shell: pwsh
        run: |
          Copy-Item InstallAndRun/Windows/runMMC-packaged.cmd dist/MMC/runMMC.cmd

      - name: Install Inno Setup
        shell: pwsh
        run: |
          winget install --id JRSoftware.InnoSetup.7 -e `
            --scope machine `
            --accept-source-agreements `
            --accept-package-agreements `
            --disable-interactivity

      - name: Create Windows installer
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $iscc = "${env:ProgramFiles}\Inno Setup 7\ISCC.exe"

          if (-not (Test-Path $iscc)) {
            throw "Inno Setup compiler not found at: $iscc"
          }

          & $iscc `
            "/DMyAppVersion=$version" `
            "InstallAndRun\Windows\MMC.iss"

      - name: Create Windows archive
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $version = "${{ github.ref_name }}"
          }
          else {
            $version = "test"
          }

          Compress-Archive `
            -Path dist/MMC/* `
            -DestinationPath "MMC-$version-windows-x64.zip"

      - name: Stage Windows artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/release | Out-Null
          Copy-Item MMC-*-windows-x64.zip dist/release/
          Copy-Item dist/installer/*.exe dist/release/

      - name: Upload Windows distribution
        uses: actions/upload-artifact@v7
        with:
          name: MMC-windows-x64
          path: dist/release/*
          if-no-files-found: error

  linux-x64:
    name: Build Linux x64 distribution
    needs: ci
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          architecture: x64
          cache: npm

      - name: Prepare distribution
        uses: ./.github/actions/prepare-distribution

      - name: Copy Node.js runtime
        run: cp "$(command -v node)" dist/MMC/runtime/node

      - name: Copy launcher
        run: |
          cp InstallAndRun/Linux/runMMC dist/MMC/runMMC
          chmod +x dist/MMC/runMMC
          chmod +x dist/MMC/runtime/node

      - name: Create Linux archive
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME}"
          else
            version="test"
          fi

          tar \
            -C dist \
            -czf "MMC-${version}-linux-x64.tar.gz" \
            MMC

      - name: Stage Linux artifacts
        run: |
          mkdir -p dist/release
          cp MMC-*-linux-x64.tar.gz dist/release/

      - name: Create Debian package
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"

          mkdir -p dist/deb/DEBIAN
          mkdir -p dist/deb/opt/mmc
          mkdir -p dist/deb/usr/bin

          cp -a dist/MMC/. dist/deb/opt/mmc/

          cat > dist/deb/DEBIAN/control <<EOF
          Package: mmc
          Version: ${VERSION}
          Section: electronics
          Priority: optional
          Architecture: amd64
          Maintainer: MMC project
          Description: MERG Module Management Console
          EOF

          cat > dist/deb/usr/bin/mmc <<'EOF'
          #!/bin/sh

          exec /opt/mmc/runMMC "$@"
          EOF

          chmod 755 dist/deb/usr/bin/mmc

          mkdir -p dist/deb/usr/share/icons/hicolor/256x256/apps
          cp InstallAndRun/Linux/MMCicon-256.png \
            dist/deb/usr/share/icons/hicolor/256x256/apps/mmc.png

          mkdir -p dist/deb/usr/share/applications

          cat > dist/deb/usr/share/applications/mmc.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=MMC
          Comment=MERG Module Management Console
          Exec=mmc
          Icon=mmc
          Terminal=false
          Categories=Utility;
          EOF

          dpkg-deb --build --root-owner-group \
            dist/deb \
            "dist/release/MMC-${VERSION}-linux-x64.deb"

      - name: Upload Linux distribution
        uses: actions/upload-artifact@v7
        with:
          name: MMC-linux-x64
          path: dist/release/*
          if-no-files-found: error

  macos:
    name: Build macOS ${{ matrix.arch }} distribution
    needs: ci
    runs-on: ${{ matrix.runner }}

    strategy:
      matrix:
        include:
          - arch: arm64
            runner: macos-14
          - arch: x64
            runner: macos-15-intel

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          architecture: ${{ matrix.arch }}
          cache: npm

      - name: Prepare distribution
        uses: ./.github/actions/prepare-distribution

      - name: Copy Node.js runtime
        shell: bash
        run: |
          cp "$(command -v node)" dist/MMC/runtime/node
          chmod +x dist/MMC/runtime/node

      - name: Copy launcher
        shell: bash
        run: |
          cp InstallAndRun/MacOS/runMMC dist/MMC/runMMC
          chmod +x dist/MMC/runMMC

      - name: Create macOS archive
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME}"
          else
            version="test"
          fi

          tar \
            -C dist \
            -czf "MMC-${version}-macos-${{ matrix.arch }}.tar.gz" \
            MMC

      - name: Upload macOS distribution
        uses: actions/upload-artifact@v7
        with:
          name: MMC-macos-${{ matrix.arch }}
          path: MMC-*-macos-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  release:
    name: Create GitHub release
    if: github.ref_type == 'tag'
    needs:
      - windows-x64
      - linux-x64
      - macos
    runs-on: ubuntu-latest

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          pattern: MMC-*
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [[ "${GITHUB_REF_NAME}" == *-beta.* ]]; then
            gh release create "${GITHUB_REF_NAME}" \
              dist/* \
              --repo "${GITHUB_REPOSITORY}" \
              --title "MMC ${GITHUB_REF_NAME}" \
              --generate-notes \
              --prerelease
          else
            gh release create "${GITHUB_REF_NAME}" \
              dist/* \
              --repo "${GITHUB_REPOSITORY}" \
              --title "MMC ${GITHUB_REF_NAME}" \
              --generate-notes
          fi
